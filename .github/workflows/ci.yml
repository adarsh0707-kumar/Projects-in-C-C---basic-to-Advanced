# NOTE ON PLACEMENT: this repo hosts multiple independent projects
# (Calculator, GuessTheNumber, ...), but GitHub Actions only reads
# workflow files from <repo-root>/.github/workflows/ -- not from a
# subproject's own .github/workflows/. So this file needs to live at
# the *repository* root, e.g.:
#
#   Projects-in-C-C---basic-to-Advanced/
#   ├── .github/workflows/ci.yml   <-- this file goes here
#   ├── Calculator/
#   └── GuessTheNumber/
#
# Every step below sets working-directory: Calculator so the build
# runs against this subproject specifically.

name: Calculator CI

on:
  push:
    branches: [ main ]
    paths:
      - 'Calculator/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Calculator/**'
      - '.github/workflows/ci.yml'

defaults:
  run:
    working-directory: Calculator

jobs:
  # Phase 35: the portability gate. The Makefile jobs below are
  # Linux-only by nature (POSIX shell), so this is the job that proves
  # the CMake build actually works on macOS and Windows rather than
  # merely being written to.
  #
  # Qt6 is deliberately NOT installed here: the CLI and the test suite
  # have no external dependencies, and CMakeLists.txt treats a missing
  # Qt as "skip the GUI target", so this also exercises that path.
  cross-platform:
    name: CMake (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # --config is required by multi-config generators (Visual Studio,
      # Xcode) and ignored by single-config ones, so one line covers all
      # three runners.
      - name: Build
        run: cmake --build build --config Release

      # -V rather than --output-on-failure: on a pass, the latter hides
      # everything, so the per-platform test count -- and the SKIPPED
      # line Windows prints where fork() is unavailable -- never reached
      # the log. That difference in coverage is exactly what should be
      # visible.
      - name: Run unit test suite
        run: ctest --test-dir build --build-config Release -V

      # Proves the built binary actually starts and evaluates, which is
      # the claim a downloadable release makes. bash is present on every
      # GitHub runner including Windows, so one script covers all three;
      # the binary's location differs (multi-config generators nest it
      # under Release/), hence the find.
      - name: Smoke test the CLI
        shell: bash
        run: |
          BIN=$(find build -type f \( -name calculator -o -name calculator.exe \) | head -1)
          echo "Running $BIN"
          printf '1\n2+3*4\n1\nsqrt(16)\n2\n12\n' | "$BIN"

  build-and-test:
    name: Build & Test (${{ matrix.build }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build: [debug, release]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build calculator (${{ matrix.build }})
        run: make BUILD=${{ matrix.build }} all

      - name: Run unit test suite
        run: make BUILD=${{ matrix.build }} test

  # The project builds warning-free under five flags, and this is what
  # keeps that true rather than aspirational. It was -Wall -Wextra only
  # until a sweep under the other three found seven conversion warnings
  # -- among them two unguarded buffer sizes in stack.c, where a zero
  # would have become SIZE_MAX inside strncpy.
  warnings:
    name: Warnings as errors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build with -Werror
        run: make WARN_FLAGS="-Wall -Wextra -Wpedantic -Wshadow -Wconversion -Werror" all

      - name: Build the test suite with -Werror
        run: make WARN_FLAGS="-Wall -Wextra -Wpedantic -Wshadow -Wconversion -Werror" test

  # Replaces "the suite is large" with a measured figure. Uses gcov,
  # which ships with GCC, so the job installs nothing and the same
  # command works locally.
  #
  # The threshold guards against backsliding rather than demanding a
  # number: it sits just below the current total, so a change that
  # meaningfully reduces coverage fails while ordinary churn does not.
  coverage:
    name: Line coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build instrumented, run the suite and report
        run: make coverage THRESHOLD=78

  sanitizers:
    name: Sanitizer checks (${{ matrix.build }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build: [asan, ubsan]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build with ${{ matrix.build }}
        run: make BUILD=${{ matrix.build }} all

      # The `mkdir -p Build` that used to be here is gone: history no
      # longer writes to ./Build (see historyFilePath()), so there is
      # nothing to create.
      - name: Smoke test under ${{ matrix.build }}
        run: |
          printf "1\n2+2*5\n1\n10 %% 3\n1\n5/0\n11\nplot(sin(x))\n11\nplot(1/x)\n11\nplot(x!)\n7\n3+4i\n8\n[[1,2],[3,4]]+[[5,6],[7,8]]\n12\n" | ./calculator

      - name: Run unit test suite under ${{ matrix.build }}
        run: make BUILD=${{ matrix.build }} test
