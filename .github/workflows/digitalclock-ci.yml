# NOTE ON PLACEMENT: this repo hosts multiple independent projects
# (Calculator, DigitalClock, GuessTheNumber, ...), but GitHub Actions
# only reads workflow files from <repo-root>/.github/workflows/ -- not
# from a subproject's own .github/workflows/. So this file lives at the
# repository root and every step sets working-directory: DigitalClock.
#
# The path filters below keep a Calculator change from triggering this
# workflow, and vice versa.

name: DigitalClock CI

on:
  push:
    branches: [ main ]
    paths:
      - 'DigitalClock/**'
      - '.github/workflows/digitalclock-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'DigitalClock/**'
      - '.github/workflows/digitalclock-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: DigitalClock

jobs:
  # The portability gate, and the reason this workflow exists.
  #
  # Through v1.1.0 the project shipped _WIN32 branches in Console,
  # Logger, Clock and Date that had never been compiled, let alone run.
  # The Testing Report recorded Windows as "implemented, not verified"
  # (KI-000) rather than claiming support it had not earned. This job is
  # what closes that gap: it builds and runs the suite on all three
  # platforms.
  #
  # Building alone would not be enough. The Windows-specific code is in
  # the rendering and terminal paths, which no unit test reaches, so the
  # smoke step runs the application itself with --once.
  cross-platform:
    name: CMake (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # --config is required by multi-config generators (Visual Studio,
      # Xcode) and ignored by single-config ones, so one line covers all
      # three runners.
      - name: Build
        run: cmake --build build --config Release

      # -V rather than --output-on-failure: on a pass the latter hides
      # everything, so the per-platform test count never reaches the log.
      # Seeing the suite actually run on Windows is the evidence this job
      # exists to produce.
      #
      # The suite resolves Config/ and Resources/ relative to the project
      # root, which is why CMakeLists sets WORKING_DIRECTORY.
      - name: Run test suite
        run: ctest --test-dir build --build-config Release -V

      # Executes the console, layout and rendering paths that the unit
      # tests reach only indirectly. --once draws a single frame and
      # exits, so this works on a runner with no interactive terminal.
      #
      # Run from the project root so Config/ and Resources/ resolve. The
      # binary's location differs between generators (multi-config ones
      # nest it under Release/), hence the find.
      - name: Smoke test the application
        shell: bash
        run: |
          BIN=$(find Build build -type f \
                \( -name DigitalClock -o -name DigitalClock.exe \) 2>/dev/null | head -1)

          if [ -z "$BIN" ]; then
            echo "::error::could not locate the built executable"
            find Build build -type f -name 'DigitalClock*' || true
            exit 1
          fi

          echo "Running $BIN"

          "$BIN" --version
          "$BIN" --help > /dev/null

          # Strip ANSI escapes so the assertions below match on any
          # runner, coloured or not.
          "$BIN" --once | sed 's/\x1b\[[0-9;?]*[A-Za-z]//g' > frame.txt

          echo "--- rendered frame ---"
          cat frame.txt
          echo "----------------------"

          # A frame that renders but omits its content would still exit 0,
          # so assert the parts that prove the layout actually composed.
          grep -q 'Theme' frame.txt || { echo "::error::status bar missing"; exit 1; }
          grep -q 'Press Q' frame.txt || { echo "::error::footer missing"; exit 1; }
          grep -qE '[0-9]{2} : [0-9]{2} : [0-9]{2}' frame.txt \
            || { echo "::error::clock not rendered"; exit 1; }

          echo "Smoke test passed."

  # The graphical interface added in v2.0.0.
  #
  # Building it would only prove it compiles. The parts most likely to
  # break are the ones that need a running Qt event loop and a realised
  # window -- the layout, the stylesheet built from the theme files, the
  # timer that drives the readout -- so this starts it for real on a
  # virtual display and asserts on what it did.
  #
  # The CLI jobs above deliberately do not install Qt. The console
  # application has no third-party dependencies and its CI should keep
  # proving that, rather than quietly building against whatever the GUI
  # job happens to have pulled in.
  gui:
    name: Graphical interface
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev xvfb x11-utils

      - name: Configure and build
        run: |
          cmake -B build-gui -DCMAKE_BUILD_TYPE=Release \
                             -DDIGITALCLOCK_BUILD_GUI=ON
          cmake --build build-gui -j

      # If Qt were missing the CMake option would silently skip the
      # target and every step below would pass by doing nothing, so the
      # binary's existence is asserted rather than assumed.
      - name: Confirm the GUI target was actually built
        run: |
          test -x Build/digitalclock-gui \
            || { echo "::error::digitalclock-gui was not built"; exit 1; }

          ./Build/digitalclock-gui --version

      # The window driven by keyboard, asserting on what is displayed
      # rather than on its members -- every GUI defect so far has been a
      # discrepancy between correct state and what the user could see or
      # do, which a state-only assertion passes straight through.
      - name: Run the GUI test suite
        run: |
          ctest --test-dir build-gui -R digitalclock_gui_tests \
                --output-on-failure -V

      - name: Run the GUI headless
        run: |
          xvfb-run -a --server-args="-screen 0 1024x768x24" \
            ./Build/digitalclock-gui --once

          echo "GUI started, drew a frame and exited cleanly."

      # A window that opens and immediately dies would still pass the
      # step above if --once happened to exit first, so this one starts
      # it normally and checks it is still alive a few seconds later.
      - name: Confirm the window stays up
        run: |
          xvfb-run -a --server-args="-screen 0 1024x768x24" bash -c '
            ./Build/digitalclock-gui &
            PID=$!
            sleep 6

            if ! kill -0 $PID 2>/dev/null; then
              wait $PID
              echo "::error::the GUI exited on its own"
              exit 1
            fi

            # It should also have put a real window on the display.
            if ! xwininfo -root -children | grep -qi "digital clock"; then
              echo "::error::no Digital Clock window found on the display"
              xwininfo -root -children
              kill $PID
              exit 1
            fi

            echo "Window present and still running after 6 seconds."
            kill $PID
          '

  # The Makefile is POSIX-only by nature, so these jobs are Linux-only.
  build-and-test:
    name: Make (${{ matrix.build }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build: [release, debug]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build (${{ matrix.build }})
        run: |
          if [ "${{ matrix.build }}" = "debug" ]; then
            make debug
          else
            make
          fi

      # `make test` builds the plugins too: the suite loads a real one and
      # two deliberately broken fixtures, so a build without them would
      # skip exactly the cases that matter.
      - name: Run test suite
        run: make test

      - name: Confirm the bundled plugin was built and is loaded
        run: |
          test -f Plugins/pomodoro.so \
            || { echo "::error::the pomodoro plugin was not built"; exit 1; }

          ./Build/DigitalClock --once > /dev/null

          grep -q "Loaded 1 plugin" Logs/application.log \
            || { echo "::error::the plugin was not loaded at startup"; \
                 tail -20 Logs/application.log; exit 1; }

          echo "Plugin built and loaded."

      - name: Smoke test the application
        run: ./Build/DigitalClock --once > /dev/null

  # The project compiles warning-free under five warning flags, and that
  # is part of its contract with contributors (CONTRIBUTING.md). Treating
  # warnings as errors here keeps the claim true rather than aspirational.
  warnings:
    name: Warnings as errors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build with -Werror
        run: make OPTIMIZE="-O2 -Werror"

      - name: Build the test suite with -Werror
        run: make OPTIMIZE="-O2 -Werror" test

  # Replaces the component-level coverage claim the Testing Report used to
  # carry with a measured figure. Uses gcov, which ships with GCC, so the
  # job installs nothing and the same command works locally.
  #
  # The threshold guards against backsliding rather than demanding a number:
  # it sits just below the current total, so a change that meaningfully
  # reduces coverage fails while ordinary churn does not.
  coverage:
    name: Line coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build instrumented and run the suite
        run: make COVERAGE=1 Build/DigitalClockTests && ./Build/DigitalClockTests > /dev/null

      - name: Report coverage
        run: ./Scripts/coverage.sh 92

  sanitizers:
    name: Sanitizer (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # thread joined the list when the refresh loop tests (TC-066 - TC-072)
        # introduced a background reader alongside the loop under test.
        sanitizer: [address, undefined, thread]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # halt_on_error makes UBSan fail the job rather than printing a
      # diagnostic and carrying on, which would let a real defect pass as
      # a green run.
      # `all` as well as `test`: the test target builds only the test
      # binary, so without it the smoke step below has no application to
      # run.
      - name: Build and run test suite under ${{ matrix.sanitizer }}
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1
          TSAN_OPTIONS: halt_on_error=1
        run: make SANITIZE=${{ matrix.sanitizer }} all test

      - name: Smoke test under ${{ matrix.sanitizer }}
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1
          TSAN_OPTIONS: halt_on_error=1
        run: ./Build/DigitalClock --once > /dev/null
