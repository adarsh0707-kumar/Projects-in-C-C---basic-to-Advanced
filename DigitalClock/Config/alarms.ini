# =========================================================
# Digital Clock System - Alarms
# =========================================================
# One alarm per numbered key. Indices need not be contiguous.
#
#   AlarmN = HH:MM | Label | Repeat
#
# Label and Repeat are optional. Repeat accepts:
#
#   Once      rings at the next occurrence, then disarms
#   Daily     every day
#   Weekdays  Monday to Friday
#   Weekends  Saturday and Sunday
#   Mon,Wed   an explicit comma-separated day list
#
# Prefix a line with '!' to keep an alarm on file but disarmed.
# Press S to snooze a ringing alarm, D to dismiss it.
# =========================================================

# Alarm1=07:30 | Wake up      | Weekdays
# Alarm2=13:00 | Lunch break  | Daily
# Alarm3=22:30 | Wind down    | Sun,Mon,Tue,Wed,Thu
# Alarm4=09:00 | One-off      | Once
# !Alarm5=06:00 | Disabled example | Daily
