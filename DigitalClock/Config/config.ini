# =========================================================
# Digital Clock System - Configuration
# =========================================================
# Lines beginning with '#' or ';' are comments.
# Keys are matched case-insensitively.
# Invalid values are replaced by the defaults shown here.
# =========================================================

# ---------------------------------------------------------
# Display
# ---------------------------------------------------------

# Clock format: 12 or 24.
TimeFormat=24

# Date format: LONG, DD-MM-YYYY, MM-DD-YYYY or YYYY-MM-DD.
DateFormat=LONG

# Colour theme: Dark, Light, Blue, Green or HighContrast.
Theme=Dark

# Redraw interval in milliseconds. Accepted range: 50 - 60000.
RefreshInterval=1000

# ---------------------------------------------------------
# Resources
# ---------------------------------------------------------

# Banner artwork shown at the top of the screen.
Banner=Resources/banner.txt

# ---------------------------------------------------------
# Alarms
# ---------------------------------------------------------

# Master switch for the alarm module.
Alarms=Enabled

# File holding the alarm definitions.
AlarmFile=Config/alarms.ini

# Snooze delay in minutes. Accepted range: 1 - 240.
SnoozeMinutes=5

# Emit the terminal bell while an alarm is ringing.
AlarmBell=true

# ---------------------------------------------------------
# Logging
# ---------------------------------------------------------

# Master switch: Enabled or Disabled.
Logging=Enabled

# Log file path. Missing directories are created automatically.
LogFile=Logs/application.log

# Lowest severity recorded: DEBUG, INFO, WARNING or ERROR.
LogLevel=INFO

# Mirror log entries to the terminal. Leave false; console output
# would interfere with the clock rendering.
ConsoleLog=false
